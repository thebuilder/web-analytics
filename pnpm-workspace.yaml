packages:
  - apps/*
  - src/TheBuilder.WebAnalytics/Client
allowBuilds:
  # Download telemetry that Blume's API tooling pulls in. Its install script only reports the
  # download, so it never runs.
  '@scarf/scarf': false
  # Node's WebGPU backend for vgpu. The hero particles run in the browser, so it isn't needed.
  '@vgpu/adapter-node': false
  esbuild: true
  sharp: true
  webgpu: false
minimumReleaseAgeExclude:
  # Our own packages are trusted, so new releases install right away.
  - '@thebuilder/*'
  - blume@1.4.3
